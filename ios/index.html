<title>Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0a1a}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans",
  "Hiragino Kaku Gothic ProN",system-ui,"Helvetica Neue",Arial,sans-serif;
  color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;
  touch-action:none;isolation:isolate;
  --k:clamp(60px,min(21.5vw,9.4vh),82px)}

/* ---------------- 壁紙 ---------------- */
.wall{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(70% 48% at 22% 16%, rgba(120,86,255,.95) 0%, rgba(120,86,255,0) 62%),
    radial-gradient(62% 44% at 84% 26%, rgba(238,86,168,.80) 0%, rgba(238,86,168,0) 60%),
    radial-gradient(78% 52% at 74% 74%, rgba(58,110,255,.78) 0%, rgba(58,110,255,0) 62%),
    radial-gradient(90% 55% at 18% 92%, rgba(24,196,196,.55) 0%, rgba(24,196,196,0) 60%),
    linear-gradient(168deg,#1b1140 0%,#241357 32%,#161a4e 62%,#0a0a1e 100%)}
.wall::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 92% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,.5) 100%)}
.wall.dim::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.30);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

/* ---------------- ステータスバー（ホーム画面に追加した場合はiOS側が描くので隠す） -------- */
.statusbar{position:absolute;top:0;left:0;right:0;z-index:40;
  height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:32px;padding-right:26px;font-size:15px;font-weight:600;
  letter-spacing:.2px;pointer-events:none;font-variant-numeric:tabular-nums}
#app.standalone .statusbar{display:none}
.sb-r{display:flex;align-items:center;gap:6px}
.sb-r svg{display:block}

/* ---------------- ロック画面 ---------------- */
#lock{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top) + clamp(30px,7.5vh,74px));
  padding-bottom:calc(env(safe-area-inset-bottom) + 6px);
  transition:opacity .45s ease, transform .45s cubic-bezier(.32,.9,.3,1)}
#lock.gone{opacity:0;transform:scale(1.09);pointer-events:none}

.lk-date{font-size:clamp(15px,4vw,17px);font-weight:600;letter-spacing:.2px;opacity:.94}
.lk-clock{font-size:clamp(64px,min(23vw,11.5vh),96px);font-weight:600;line-height:1.02;
  letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-top:2px;
  text-shadow:0 2px 24px rgba(0,0,0,.24)}

.pin-title{margin-top:clamp(18px,5vh,58px);font-size:16px;font-weight:400;opacity:.95}
.pin-dots{display:flex;gap:22px;margin-top:clamp(14px,2.6vh,22px);height:14px;align-items:center}
.pdot{width:13px;height:13px;border-radius:50%;border:1.4px solid rgba(255,255,255,.9);
  background:transparent;transition:background .12s ease}
.pdot.on{background:#fff}
.pin-dots.shake{animation:shake .48s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-7px)}20%,80%{transform:translateX(11px)}
  30%,50%,70%{transform:translateX(-15px)}40%,60%{transform:translateX(15px)}100%{transform:translateX(0)}}
.pin-err{height:18px;margin-top:11px;font-size:14px;opacity:0;transition:opacity .16s}
.pin-err.on{opacity:.96}

.pin-pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,var(--k));
  gap:clamp(8px,1.8vh,16px) clamp(20px,7vw,28px);justify-content:center}
.pkey{width:var(--k);aspect-ratio:1;border-radius:50%;
  background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background .1s ease;cursor:pointer}
.pkey.press{background:rgba(255,255,255,.46)}
.pkey .n{font-size:calc(var(--k) * .44);font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.pkey .l{font-size:calc(var(--k) * .128);font-weight:600;letter-spacing:1.8px;margin-top:2px;line-height:1}
.pkey .l.blank{visibility:hidden}

.pad-btm{width:min(100%,320px);margin:clamp(12px,2.6vh,24px) auto 0;
  display:flex;align-items:center;justify-content:space-between;padding:0 6px;height:24px}
.actbtn{font-size:17px;font-weight:400;background:none;border:0;color:#fff;font-family:inherit;
  padding:6px 2px;cursor:pointer}
.actbtn:active{opacity:.5}
.actbtn.hidden{visibility:hidden}

/* ---------------- ホーム画面 ---------------- */
#home{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
  opacity:0;transform:scale(.93);pointer-events:none;
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,.9,.3,1)}
#home.on{opacity:1;transform:scale(1);pointer-events:auto}

.pages{flex:1;display:flex;width:200%;min-height:0;will-change:transform;
  transition:transform .34s cubic-bezier(.24,.88,.32,1)}
.page{width:50%;flex:0 0 50%;min-width:0;
  padding:calc(env(safe-area-inset-top) + 52px) 12px 0;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(6,minmax(0,1fr))}

.app{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;width:100%;height:100%}
.icon{width:min(15.4vw,62px);height:min(15.4vw,62px);flex:0 0 auto;position:relative;
  clip-path:url(#squircle);background:#222}
.icon svg{display:block;width:100%;height:100%}

    '<rect x="46" y="13" width="8" height="36" rx="3" fill="#1c1c1e"/><circle cx="50" cy="59" r="23" fill="#1c1c1e"/><circle cx="50" cy="59" r="8" fill="#f2f2f7"/>'),
  imovie: () => ic('im', '#6e5bd8', '#2b1f6b',
    '<path d="m50 21 8.6 19.4 21 3-15.2 15 3.6 21.2L50 69.6 31.9 79.6l3.6-21.2-15.2-15 21-3Z" fill="#fff"/>'),
  applestore: () => ic('ap', '#4fb0ff', '#0a63e8',
    '<path d="M29 37h42l4 42H25Z" fill="#fff"/><path d="M40 37v-6a10 10 0 0 1 20 0v6" fill="none" stroke="#fff" stroke-width="5"/>'),
  support: () => ic('sp', '#4fb0ff', '#0a63e8',
    '<circle cx="50" cy="50" r="26" fill="none" stroke="#fff" stroke-width="8"/><circle cx="50" cy="50" r="11" fill="none" stroke="#fff" stroke-width="6"/>' +
    '<g stroke="#fff" stroke-width="6" stroke-linecap="round"><path d="m32 32 8 8M68 32l-8 8M32 68l8-8M68 68l-8-8"/></g>'),
  shazam: () => ic('sz', '#42a9ff', '#0a63e8',
    '<circle cx="50" cy="50" r="29" fill="none" stroke="#fff" stroke-width="6"/>' +
    '<path d="M39 39c9-5 18 0 20 7M61 61c-9 5-18 0-20-7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>'),
  news: () => flat('#fff',
    '<text x="50" y="70" text-anchor="middle" font-size="52" font-weight="700" fill="#ff3b30">N</text>')
};

const PAGE0 = [
  ['FaceTime','facetime'], ['カレンダー','calendar'], ['写真','photos'], ['カメラ','camera'],
  ['メール','mail'], ['メモ','notes'], ['リマインダー','reminders'], ['時計','clock'],
  ['マップ','maps'], ['天気','weather'], ['株価','stocks'], ['ブック','books'],
  ['ホーム','homeapp'], ['探す','findmy'], ['ヘルスケア','health'], ['ウォレット','wallet'],
  ['設定','settings'], ['App Store','appstore'], ['翻訳','translate'], ['ファイル','files'],
  ['ショートカット','shortcuts'], ['ヒント','tips'], ['連絡先','contacts'], ['ポッドキャスト','podcasts']
];

const PAGE1 = [
  ['ボイスメモ','voicememos'], ['__MAGIC__','calculator'], ['計測','measure'], ['コンパス','compass'],
  ['拡大鏡','magnifier'], ['フリーボード','freeform'], ['TV','tv'], ['Watch','watch'],
  ['Numbers','numbers'], ['Pages','pages'], ['Keynote','keynote'], ['GarageBand','garageband'],
  ['iMovie','imovie'], ['Apple Store','applestore'], ['サポート','support'], ['ニュース','news']
];

const DOCK = [['','phone'], ['','safari'], ['','messages'], ['','music']];

/* =====================================================================
   画面の組み立て
   ===================================================================== */
function appCell(name, iconKey) {
  const d = document.createElement('div');
  d.className = 'app';
  const isMagic = name === '__MAGIC__';
  d.innerHTML = '<div class="icon">' + ICONS[iconKey]() + '</div>' +
    '<div class="label"' + (isMagic ? ' id="magicLabel"' : '') + '>' +
    (isMagic ? CFG.magicLabel : name) + '</div>';
  return d;
}

/* マジックのアプリを CFG の位置へ移動 */
(function placeMagic() {
  const src = [PAGE0, PAGE1];
  let fi = -1, fj = -1;
  src.forEach((p, i) => p.forEach((a, j) => { if (a[0] === '__MAGIC__') { fi = i; fj = j; } }));
  if (fi < 0 || (fi === CFG.magicPage && fj === CFG.magicSlot)) return;
  const item = src[fi].splice(fj, 1)[0];
  src[CFG.magicPage].splice(Math.min(CFG.magicSlot, src[CFG.magicPage].length), 0, item);
})();

PAGE0.forEach(([n, k]) => $('page0').appendChild(appCell(n, k)));
PAGE1.forEach(([n, k]) => $('page1').appendChild(appCell(n, k)));
DOCK.forEach(([n, k]) => {
  const d = document.createElement('div');
  d.className = 'app';
  d.innerHTML = '<div class="icon">' + ICONS[k]() + '</div>';
  $('dock').appendChild(d);
});

/* ホーム画面に追加して起動した場合は、iOS 側がステータスバーとホームバーを描く */
(function detectStandalone() {
  let sa = false;
  if (navigator.standalone === true) sa = true;
  try {
    if (matchMedia('(display-mode: standalone)').matches ||
        matchMedia('(display-mode: fullscreen)').matches) sa = true;
  } catch (e) {}
  if (sa) $('app').classList.add('standalone');
})();

/* =====================================================================
   時計（実時間）
   ===================================================================== */
function tick() {
  const d = new Date();
  const h12 = d.getHours() % 12 || 12;
  const hm = h12 + ':' + String(d.getMinutes()).padStart(2, '0');
  $('sbTime').textContent = hm;
  $('lkClock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  $('lkDate').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日' + WD[d.getDay()] + '曜日';
  const cw = $('calW'), cd = $('calD');
  if (cw) cw.textContent = WD[d.getDay()] + '曜日';
  if (cd) cd.textContent = d.getDate();
  const rot = (id, deg) => { const e = $(id); if (e) e.setAttribute('transform', 'rotate(' + deg + ' 50 50)'); };
  rot('ckH', (d.getHours() % 12) * 30 + d.getMinutes() * 0.5);
  rot('ckM', d.getMinutes() * 6);
  rot('ckS', d.getSeconds() * 6);
}
tick();
setInterval(tick, 1000);

/* =====================================================================
   ロック画面
   ===================================================================== */
const st = { len: CFG.defaultLen, input: '', tries: 0, first: '', busy: false, unlocked: false };
const dotsEl = $('dots'), errEl = $('err'), delEl = $('btnDel');

function renderDots() {
  dotsEl.innerHTML = '';
  for (let i = 0; i < st.len; i++) {
    const d = document.createElement('div');
    d.className = 'pdot' + (i < st.input.length ? ' on' : '');
    dotsEl.appendChild(d);
  }
  delEl.classList.toggle('hidden', st.input.length === 0);
}

const LETTERS = ['', 'ABC', 'DEF', 'GHI', 'JKL', 'MNO', 'PQRS', 'TUV', 'WXYZ'];
(function buildPad() {
  const pad = $('pad');
  [1,2,3,4,5,6,7,8,9,null,0,null].forEach((n) => {
    const k = document.createElement('div');
    if (n === null) { k.style.visibility = 'hidden'; k.className = 'pkey'; pad.appendChild(k); return; }
    k.className = 'pkey';
    k.dataset.n = n;
    const l = n === 0 ? '' : LETTERS[n - 1];
    k.innerHTML = '<div class="n">' + n + '</div><div class="l' + (l ? '' : ' blank') + '">' + (l || 'X') + '</div>';
    pad.appendChild(k);
  });
})();

function addDigit(n) {
  if (st.busy || st.unlocked || st.input.length >= st.len) return;
  st.input += n;
  if (st.input.length === 1) errEl.classList.remove('on');
  renderDots();
  buzz(8);
  if (st.input.length === st.len) submit();
}

function submit() {
  st.busy = true;
  const code = st.input;
  if (st.tries === 0) st.first = code;
  setTimeout(() => {
    st.tries++;
    if (st.tries <= CFG.failCount) fail();
    else unlock(CFG.nameSource === 'first' ? st.first : code);
  }, 250);
}

function fail() {
  buzz([40, 90, 40]);
  dotsEl.classList.remove('shake');
  void dotsEl.offsetWidth;
  dotsEl.classList.add('shake');
  errEl.classList.add('on');
  setTimeout(() => { st.input = ''; renderDots(); st.busy = false; }, 450);
  setTimeout(() => errEl.classList.remove('on'), 2600);
}

function unlock(code) {
  st.unlocked = true;
  st.busy = false;
  buzz(18);
  const lbl = $('magicLabel');
  if (lbl) lbl.textContent = code;
  $('wall').classList.remove('dim');
  $('lock').classList.add('gone');
  $('home').classList.add('on');
  goPage(0, false);
}

function relock() {
  st.input = ''; st.tries = 0; st.first = '';
  st.busy = false; st.unlocked = false;
  const lbl = $('magicLabel');
  if (lbl) lbl.textContent = CFG.magicLabel;
  errEl.classList.remove('on');
  renderDots();
  $('wall').classList.add('dim');
  $('home').classList.remove('on');
  $('lock').classList.remove('gone');
  goPage(0, false);
  buzz([18, 60, 18]);
}

renderDots();

$('pad').addEventListener('pointerdown', (e) => {
  const k = e.target.closest('.pkey');
  if (!k || !k.dataset.n) return;
  e.preventDefault();
  k.classList.add('press');
  setTimeout(() => k.classList.remove('press'), 110);
  addDigit(k.dataset.n);
});

delEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (st.busy || st.unlocked) return;
  st.input = st.input.slice(0, -1);
  renderDots();
  buzz(6);
});
$('btnEmg').addEventListener('pointerdown', (e) => { e.preventDefault(); buzz(6); });

/* =====================================================================
   長押しジェスチャー（指が動いたら取り消し）
   ===================================================================== */
function longPress(el, ms, fn, filter) {
  let t = null, sx = 0, sy = 0;
  const cancel = () => { if (t) { clearTimeout(t); t = null; } };
  el.addEventListener('pointerdown', (e) => {
    if (filter && !filter(e)) return;
    cancel();
    sx = e.clientX; sy = e.clientY;
    t = setTimeout(() => { t = null; fn(); }, ms);
  });
  window.addEventListener('pointermove', (e) => {
    if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) cancel();
  });
  window.addEventListener('pointerup', cancel);
  window.addEventListener('pointercancel', cancel);
}

/* ロック画面：数字キー以外を3秒長押し → リセット */
longPress($('lock'), 3000, () => { if (!st.unlocked) relock(); },
          (e) => !e.target.closest('.pkey') && !e.target.closest('.actbtn'));

/* ロック画面：「緊急通報」を長押し → 4桁 / 6桁 切り替え */
longPress($('lock'), 800, () => {
  if (st.busy || st.unlocked) return;
  st.len = (st.len === 6) ? 4 : 6;
  st.input = '';
  errEl.classList.remove('on');
  renderDots();
  buzz(14);
}, (e) => e.target.id === 'btnEmg');

/* ホーム画面：どこでも3秒長押し → ロック画面に戻す（再演用） */
longPress($('home'), 3000, () => { if (st.unlocked) relock(); });

window.addEventListener('keydown', (e) => {
  if (st.unlocked) return;
  if (/^[0-9]$/.test(e.key)) addDigit(e.key);
  else if (e.key === 'Backspace') { st.input = st.input.slice(0, -1); renderDots(); }
});

/* =====================================================================
   ページ切り替え
   ===================================================================== */
const pagesEl = $('pages');
const pdEls = () => Array.from($('pagedots').children);
let cur = 0, dragging = false, startX = 0, startY = 0, dx = 0, axis = null;
const W = () => window.innerWidth;

function goPage(i, animate) {
  cur = Math.max(0, Math.min(1, i));
  if (animate === false) pagesEl.style.transition = 'none';
  pagesEl.style.transform = 'translateX(' + (-cur * W()) + 'px)';
  if (animate === false) { void pagesEl.offsetWidth; pagesEl.style.transition = ''; }
  pdEls().forEach((d, n) => d.classList.toggle('on', n === cur));
}
/* 全画面移行後にビューポート高が更新されない端末向けの保険 */
function isStandalone() {
  if (navigator.standalone === true) return true;
  try {
    return matchMedia('(display-mode: standalone)').matches ||
           matchMedia('(display-mode: fullscreen)').matches;
  } catch (e) { return false; }
}
function fitViewport() {
  let h = window.innerHeight;
  if (isStandalone()) {
    const sh = Math.round(screen.height);
    if (sh > h && sh - h < h * 0.15) h = sh;
  }
  const app = $('app');
  app.style.height = h + 'px';
  app.style.width = window.innerWidth + 'px';
}
function relayout() { fitViewport(); goPage(cur, false); }
fitViewport();
goPage(0, false);
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', relayout);
document.addEventListener('fullscreenchange', relayout);
document.addEventListener('visibilitychange', () => { if (!document.hidden) relayout(); });
try { visualViewport.addEventListener('resize', relayout); } catch (e) {}
[120, 400, 1200, 2500].forEach((ms) => setTimeout(relayout, ms));

pagesEl.addEventListener('pointerdown', (e) => {
  if (!st.unlocked) return;
  dragging = true; axis = null; dx = 0;
  startX = e.clientX; startY = e.clientY;
  pagesEl.style.transition = 'none';
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const ddx = e.clientX - startX, ddy = e.clientY - startY;
  if (axis === null) {
    if (Math.abs(ddx) > 8 || Math.abs(ddy) > 8) axis = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
    else return;
  }
  if (axis !== 'x') return;
  dx = ddx;
  if ((cur === 0 && dx > 0) || (cur === 1 && dx < 0)) dx *= 0.32;
  pagesEl.style.transform = 'translateX(' + (-cur * W() + dx) + 'px)';
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  pagesEl.style.transition = '';
  if (axis === 'x' && Math.abs(dx) > W() * 0.18) goPage(cur + (dx < 0 ? 1 : -1));
  else goPage(cur);
  dx = 0; axis = null;
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
$('pagedots').addEventListener('pointerup', (e) => {
  const i = pdEls().indexOf(e.target.closest('.pd'));
  if (i >= 0) goPage(i);
});

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
