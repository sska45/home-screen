<title>Lock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#4f4f4f}
body{
  font-family:"SamsungOne","One UI Sans","Samsung Sans",system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;isolation:isolate;
  --k:clamp(58px,min(21vw,9.2vh),80px)}

/* ---------------- 壁紙 ---------------- */
.wall{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(52% 38% at 33% 38%, rgba(211,195,124,.78) 0%, rgba(206,191,122,.42) 46%, rgba(206,191,122,0) 74%),
    radial-gradient(45% 30% at 62% 26%, rgba(238,228,168,.55) 0%, rgba(238,228,168,0) 70%),
    radial-gradient(85% 55% at 96% 12%, rgba(150,150,148,.75) 0%, rgba(150,150,148,0) 62%),
    radial-gradient(120% 62% at 52% 112%, #3f3f3f 0%, rgba(63,63,63,0) 62%),
    linear-gradient(178deg,#a5a5a3 0%,#96968f 26%,#7d7d76 52%,#5c5c58 78%,#3f3f3e 100%)}
.wall::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.9) 0 .8px, rgba(255,255,255,0) 1.6px),
    radial-gradient(circle, rgba(255,255,255,.65) 0 .7px, rgba(255,255,255,0) 1.4px);
  background-size:137px 181px, 193px 149px;
  background-position:22px 41px, 96px 127px}
.wall.dim::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(28,28,30,.42)}

/* ---------------- ロック画面（One UI 風） ---------------- */
#lock{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top) + clamp(24px,7vh,72px));
  padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
  transition:opacity .4s ease, transform .4s cubic-bezier(.3,.9,.3,1)}
#lock.gone{opacity:0;transform:scale(1.06);pointer-events:none}

.lk-clock{font-size:clamp(50px,min(19vw,10vh),82px);font-weight:300;line-height:1;
  letter-spacing:-1px;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.lk-date{font-size:14.5px;font-weight:500;margin-top:10px;opacity:.95;letter-spacing:.2px}

.pin-title{margin-top:clamp(16px,5.5vh,64px);font-size:15px;font-weight:500;opacity:.97}
.pin-dots{display:flex;gap:16px;margin-top:clamp(12px,2.4vh,20px);height:12px;align-items:center}
.pdot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.32);
  transition:background .1s ease, transform .1s ease}
.pdot.on{background:#fff;transform:scale(1.06)}
.pin-dots.shake{animation:shake .46s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-6px)}20%,80%{transform:translateX(10px)}
  30%,50%,70%{transform:translateX(-13px)}40%,60%{transform:translateX(13px)}100%{transform:translateX(0)}}
.pin-err{height:17px;margin-top:10px;font-size:13px;color:#ff9a92;opacity:0;transition:opacity .16s}
.pin-err.on{opacity:1}

.pin-pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,var(--k));
  gap:clamp(6px,1.6vh,14px) clamp(18px,7vw,32px);justify-content:center}
.pkey{width:var(--k);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--k) * .42);font-weight:300;line-height:1;
  font-variant-numeric:tabular-nums;transition:background .1s ease;cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,.25)}
.pkey.press{background:rgba(255,255,255,.24)}
.pkey.side{font-size:13.5px;font-weight:500}
.pkey svg{width:26px;height:26px}

/* ---------------- スクショはめ込みモード ---------------- */
.page.shot{padding:0;display:block;position:relative;overflow:hidden}
.shot-img{position:absolute;left:0;right:0;top:0;width:100%;height:100%;object-fit:fill;display:block}
.ov{position:absolute;overflow:hidden;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%)}
.ov .ovsrc{position:absolute;max-width:none}
.ov .ovtx{position:relative;z-index:2;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
#home.shots .pageind,#home.shots .dock{display:none}

/* ---------------- ホーム画面 ---------------- */
#home{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
  opacity:0;transform:scale(.95);pointer-events:none;
  transition:opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1)}
#home.on{opacity:1;transform:scale(1);pointer-events:auto}

.pages{flex:1;display:flex;width:200%;min-height:0;will-change:transform;
  transition:transform .32s cubic-bezier(.24,.88,.32,1)}
.page{width:50%;flex:0 0 50%;min-width:0;
  padding:calc(env(safe-area-inset-top) + 34px) 8px 0;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}

.app{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;width:100%;height:100%}
.icon{width:min(13.6vw,60px);height:min(13.6vw,60px);border-radius:29%;position:relative;
  overflow:hidden;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 1px 4px rgba(0,0,0,.22)}
.icon .em{font-size:min(7.6vw,33px);line-height:1;
  font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.icon .tx{font-size:min(6.6vw,29px);font-weight:800;line-height:1;letter-spacing:-.5px}
.label{font-size:min(2.6vw,10.8px);font-weight:500;line-height:1.2;max-width:96%;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* フォルダ */
.folder{background:rgba(226,226,224,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:8%;padding:13%;align-content:start}
.folder span{border-radius:26%;display:flex;align-items:center;justify-content:center;
  font-size:min(2.9vw,12px);line-height:1;overflow:hidden}

/* ---------------- ウィジェット ---------------- */
.w{margin:5px 4px;border-radius:24px;overflow:hidden;position:relative}

/* 天気 */
.w-weather{grid-column:3 / 6;grid-row:1 / 2;background:rgba(233,233,231,.62);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#1a1a1a;
  display:flex;flex-direction:column;justify-content:center;padding:6px 6px 4px}
.wx-days{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;text-align:center}
.wx-d{display:flex;flex-direction:column;align-items:center;gap:1px}
.wx-date{font-size:min(2.72vw,11.8px);font-weight:500;white-space:nowrap}
.wx-ic{display:flex;align-items:center;justify-content:center;gap:1px;
  font-size:min(4.6vw,20px);line-height:1;height:min(5.4vw,24px)}
.wx-t{font-size:min(2.4vw,10.2px);font-weight:600;white-space:nowrap;letter-spacing:-.2px}
.wx-t b{color:#e0392b;font-weight:600}
.wx-t i{color:#1f5fd0;font-style:normal;font-weight:600}
.wx-p{font-size:min(2.4vw,10px);color:#333;font-weight:500}
.wx-city{text-align:center;font-size:min(2.5vw,10.5px);margin-top:1px;color:#222;font-weight:500}
.sat{color:#1f5fd0}.sun{color:#e0392b}

/* ChatGPT */
.w-gpt{grid-column:3 / 6;grid-row:2 / 4;background:#2e2e2e;
  display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px 12px}
.gpt-pill{background:#4a4a4a;border-radius:22px;display:flex;align-items:center;gap:9px;
  padding:10px 12px;font-size:min(3.2vw,13.5px);color:#e9e9e9;line-height:1.3}
.gpt-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gpt-btns div{background:#4a4a4a;border-radius:14px;height:min(11vw,46px);
  display:flex;align-items:center;justify-content:center}
.gpt-btns svg{width:20px;height:20px;fill:none;stroke:#e9e9e9;stroke-width:1.7}

/* Claude */
.w-claude{grid-column:1 / 5;grid-row:1 / 2;background:#f2efe9;color:#2b2925;
  display:flex;flex-direction:column;justify-content:center;gap:7px;padding:9px 10px}
.cl-pill{background:#e6e3dc;border-radius:16px;display:flex;align-items:center;gap:8px;
  padding:8px 10px;font-size:min(2.9vw,12.5px);color:#5c5850;line-height:1.25}
.cl-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 2px}
.cl-btns div{background:#e6e3dc;border-radius:50%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center}
.cl-btns svg{width:17px;height:17px;fill:none;stroke:#6b665d;stroke-width:1.7}

/* TradingView ウォッチリスト */
.w-tv{grid-column:1 / 5;grid-row:2 / 7;background:#fff;color:#131722;
  display:flex;flex-direction:column;padding:0}
.tv-head{display:flex;align-items:center;gap:8px;padding:8px 10px 7px;flex:0 0 auto}
.tv-title{flex:1;min-width:0}
.tv-title b{display:block;font-size:min(3.6vw,15px);font-weight:700;line-height:1.15}
.tv-title span{display:block;font-size:min(2.5vw,10.5px);color:#787b86;line-height:1.3}
.tv-head svg{flex:0 0 auto}
.tv-list{flex:1;display:flex;flex-direction:column;min-height:0}
.wl{flex:1;display:grid;grid-template-columns:min(7.2vw,32px) minmax(0,1fr) auto;
  gap:6px;align-items:center;padding:0 10px;border-top:1px solid #eceff1;min-height:0}
.wl:first-child{border-top:0}
.wl-ic{width:min(7.2vw,32px);height:min(7.2vw,32px);border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:min(3.6vw,15px);
  font-weight:700;color:#fff;line-height:1}
.wl-m{min-width:0;display:flex;flex-direction:column;gap:1px}
.wl-r{text-align:right;display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.l1,.l2{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.sym{font-size:min(3.3vw,14px);font-weight:600;white-space:nowrap}
.desc{font-size:min(2.4vw,10px);color:#787b86;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext,.extc{font-size:min(2.9vw,12.5px);white-space:nowrap;display:flex;align-items:center;gap:2px}
.extc{font-size:min(2.5vw,10.5px)}
.px{font-size:min(3.3vw,14px);font-weight:500;font-variant-numeric:tabular-nums}
.chg{font-size:min(2.5vw,10.5px);font-variant-numeric:tabular-nums}
.up{color:#089981}.dn{color:#f23645}.flat{color:#787b86}
.moon{color:#2962ff;font-size:min(2.9vw,12px)}

/* ページインジケータ / ドック */
.pageind{display:flex;gap:9px;justify-content:center;align-items:center;
  height:26px;flex:0 0 auto;cursor:pointer}
.pi{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.42);transition:background .2s}
.pi.on{background:#fff}
.pi.home{width:12px;height:12px;border-radius:0;background:none;
  display:flex;align-items:center;justify-content:center}
.pi.home svg{width:12px;height:12px;fill:rgba(255,255,255,.42);transition:fill .2s}
.pi.home.on svg{fill:#fff}

.dock{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;
  padding:6px 18px calc(env(safe-area-inset-bottom) + 10px)}
.dock .icon{width:min(14.5vw,64px);height:min(14.5vw,64px)}
</style>

    '<span style="background:' + i[0] + ';color:' + (i[2] || '#fff') + ';font-weight:800">' + i[1] + '</span>').join('') + '</div>';
}

/* =====================================================================
   スクリーンショットのはめ込み
   ===================================================================== */
let shotMode = false;
const ovNodes = [];

/* 画像から1画素の色を取り出す（file:// では canvas が汚染されるので null を返す） */
function samplePx(img, xPct, yPct) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, Math.round(img.naturalWidth * xPct / 100),
                     Math.round(img.naturalHeight * yPct / 100), 1, 1, 0, 0, 1, 1);
    const d = g.getImageData(0, 0, 1, 1).data;
    return 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
  } catch (e) { return null; }
}

function buildOverlay(o, src, srcImg) {
  const el = document.createElement('div');
  el.className = 'ov';
  el.dataset.t = o.t;
  let img = null;
  if (o.fill === 'solid') {
    const a = samplePx(srcImg, o.src.x, o.src.y);
    if (a) el.style.background = a;
    else o.fill = 'img';
  } else if (o.fill === 'gradv') {
    const a = samplePx(srcImg, o.src.x, o.y - o.h * 0.5);
    const b = samplePx(srcImg, o.src.x, o.y + o.h * 0.5);
    if (a && b) el.style.background = 'linear-gradient(180deg,' + a + ',' + b + ')';
    else o.fill = 'img';
  }
  if (o.fill === 'img') {
    img = document.createElement('img');
    img.className = 'ovsrc';
    img.src = src;
    el.appendChild(img);
  }
  const tx = document.createElement('span');
  tx.className = 'ovtx';
  tx.style.fontWeight = o.weight;
  tx.style.color = o.color;
  if (o.shadow) tx.style.textShadow = '0 1px 3px rgba(0,0,0,.6)';
  if (o.t === 'magic') tx.id = 'magicLabel';
  if (o.t === 'magic') tx.textContent = CFG.magicLabel;
  if (o.t === 'wx') tx.style.position = 'absolute';
  el.appendChild(tx);
  el._o = o;
  el._img = img;
  el._tx = tx;
  ovNodes.push(el);
  return el;
}

/* 全画面かどうか（全画面ならスクショのシステムバーをそのまま見せる） */
function isFullscreen() {
  if (document.fullscreenElement) return true;
  try {
    if (matchMedia('(display-mode: fullscreen)').matches) return true;
  } catch (e) {}
  return false;
}

/* 画像内の y(%) → ページ内の y(%) */
let crop = { t: 0, b: 100 };
function updateCrop() {
  const full = isFullscreen();
  crop.t = full ? 0 : (CFG.bars ? CFG.bars.top : 0);
  crop.b = full ? 100 : 100 - (CFG.bars ? CFG.bars.bottom : 0);
  document.getElementById('app').classList.toggle('bars', !full);
}
const span = () => crop.b - crop.t;
const mapY = (imgPct) => (imgPct - crop.t) * 100 / span();

/* オーバーレイの位置・サイズをページの実寸に合わせて再計算 */
function layoutOverlays() {
  if (!shotMode) return;
  updateCrop();
  const pw = pagesEl.getBoundingClientRect().width / 2;
  const ph = pagesEl.getBoundingClientRect().height;
  if (!pw || !ph) return;
  const ih = ph * 100 / span();              // 画像を表示する実寸の高さ
  const iy = -ih * crop.t / 100;             // 画像の上端オフセット
  document.querySelectorAll('.shot-img').forEach((im) => {
    im.style.height = ih + 'px';
    im.style.top = iy + 'px';
    im.style.bottom = 'auto';
  });
  ovNodes.forEach((el) => {
    const o = el._o;
    const w = pw * o.w / 100, h = ih * o.h / 100;
    el.style.left = (pw * o.x / 100) + 'px';
    el.style.top = (ph * mapY(o.y) / 100) + 'px';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    if (el._img) {
      /* 中の画像をページ実寸に拡大し、きれいな壁紙の位置がこの枠に来るようずらす */
      el._img.style.width = pw + 'px';
      el._img.style.height = ih + 'px';
      el._img.style.left = (-(pw * o.src.x / 100) + w / 2) + 'px';
      el._img.style.top = (-(ih * o.src.y / 100) + h / 2) + 'px';
    }
    el._tx.style.fontSize = (pw * o.size / 100) + 'px';
    if (o.tl !== undefined) {
      el._tx.style.position = 'absolute';
      el._tx.style.left = (pw * (o.tl - o.x) / 100 + w / 2) + 'px';
      el._tx.style.transform = 'none';
    } else if (o.tx !== undefined) {
      el._tx.style.position = 'absolute';
      el._tx.style.left = (pw * (o.tx - o.x) / 100 + w / 2) + 'px';
      el._tx.style.transform = 'translateX(-50%)';
    }
  });
}

function applyShots(imgs) {
  const p0 = $('page0'), p1 = $('page1');
  [[p0, CFG.shots.p1, OV.p1, imgs[0]], [p1, CFG.shots.p2, OV.p2, imgs[1]]].forEach(([page, src, ovs, im0]) => {
    page.innerHTML = '';
    page.classList.add('shot');
    const im = document.createElement('img');
    im.className = 'shot-img';
    im.src = src;
    page.appendChild(im);
    ovs.forEach((o) => page.appendChild(buildOverlay(o, src, im0)));
  });
  $('home').classList.add('shots');
  shotMode = true;
  layoutOverlays();
  requestAnimationFrame(layoutOverlays);
}

(function initShots() {
  const srcs = [CFG.shots && CFG.shots.p1, CFG.shots && CFG.shots.p2];
  if (!srcs[0] || !srcs[1]) return;
  Promise.all(srcs.map((s) => new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = s;
  }))).then(applyShots).catch(() => { /* 画像が無ければ自作アイコン版のまま */ });
})();

function tick() {
  const d = new Date();
  const hm = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  $('lkClock').textContent = hm;
  $('lkDate').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')';
  ovNodes.forEach((el) => {
    if (el._o.t === 'clock') el._tx.textContent = hm;
    else if (el._o.t === 'tvupd') {
      /* ウィジェットの更新らしく見えるよう10分単位で切り捨てる */
      const u = new Date(d.getTime());
      u.setMinutes(Math.floor(u.getMinutes() / 10) * 10, 0, 0);
      const h12 = u.getHours() % 12 || 12;
      el._tx.textContent = '最終更新: ' + (u.getHours() < 12 ? '午前' : '午後') +
        h12 + ':' + String(u.getMinutes()).padStart(2, '0');
    }
  });
  const svg = $('clkIcon');
  if (svg) {
    const rot = (sel, deg) => { const e = svg.querySelector(sel); if (e) e.setAttribute('transform', 'rotate(' + deg + ' 50 50)'); };
    rot('.hh', (d.getHours() % 12) * 30 + d.getMinutes() * 0.5);
    rot('.mh', d.getMinutes() * 6);
    rot('.sh', d.getSeconds() * 6);
  }
}

})();

function addDigit(n) {
  if (st.busy || st.unlocked || st.input.length >= st.len) return;
  st.input += n;
  if (st.input.length === 1) errEl.classList.remove('on');
  renderDots();
  buzz(8);
  if (st.input.length === st.len) submit();
}

function submit() {
  st.busy = true;
  const code = st.input;
  if (st.tries === 0) st.first = code;
  setTimeout(() => {
    st.tries++;
    if (st.tries <= CFG.failCount) fail();
    else unlock(CFG.nameSource === 'first' ? st.first : code);
  }, 240);
}

function fail() {
  buzz([40, 90, 40]);
  dotsEl.classList.remove('shake');
  void dotsEl.offsetWidth;
  dotsEl.classList.add('shake');
  errEl.classList.add('on');
  setTimeout(() => { st.input = ''; renderDots(); st.busy = false; }, 440);
  setTimeout(() => errEl.classList.remove('on'), 2600);
}

function unlock(code) {
  st.unlocked = true;
  st.busy = false;
  buzz(18);
  const lbl = $('magicLabel');
  if (lbl) lbl.textContent = code;
  $('wall').classList.remove('dim');
  $('lock').classList.add('gone');
  $('home').classList.add('on');
  goPage(0, false);
}

function relock() {
  st.input = ''; st.tries = 0; st.first = '';
  st.busy = false; st.unlocked = false;
  const lbl = $('magicLabel');
  if (lbl) lbl.textContent = CFG.magicLabel;
  errEl.classList.remove('on');
  renderDots();
  $('wall').classList.add('dim');
  $('home').classList.remove('on');
  $('lock').classList.remove('gone');
  goPage(0, false);
  buzz([18, 60, 18]);
}

renderDots();

$('pad').addEventListener('pointerdown', (e) => {
  const k = e.target.closest('.pkey');
  if (!k) return;
  e.preventDefault();
  k.classList.add('press');
  setTimeout(() => k.classList.remove('press'), 110);
  if (k.dataset.act === 'del') {
    if (st.busy || st.unlocked) return;
    st.input = st.input.slice(0, -1); renderDots(); buzz(6);
  } else if (k.dataset.act === 'emg') {
    buzz(6);
  } else {
    addDigit(k.dataset.n);
  }
});

/* 長押し検出。指が動いたら取り消す（スワイプで誤爆しないように） */
function longPress(el, ms, fn, filter) {
  let t = null, sx = 0, sy = 0;
  const cancel = () => { if (t) { clearTimeout(t); t = null; } };
  el.addEventListener('pointerdown', (e) => {
    if (filter && !filter(e)) return;
    cancel();
    sx = e.clientX; sy = e.clientY;
    t = setTimeout(() => { t = null; fn(); }, ms);
  });
  window.addEventListener('pointermove', (e) => {
    if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) cancel();
  });
  window.addEventListener('pointerup', cancel);
  window.addEventListener('pointercancel', cancel);
}

/* ロック画面：数字キー以外を3秒長押し → リセット */
longPress($('lock'), 3000, () => { if (!st.unlocked) relock(); },
          (e) => !e.target.closest('.pkey'));

/* ロック画面：「緊急電話」を長押し → 4桁 / 6桁 切り替え */
longPress($('lock'), 800, () => {
  if (st.busy || st.unlocked) return;
  st.len = (st.len === 6) ? 4 : 6;
  st.input = '';
  errEl.classList.remove('on');
  renderDots();
  buzz(14);
}, (e) => !!e.target.closest('[data-act="emg"]'));

/* ホーム画面：どこでも3秒長押し → ロック画面に戻す（再演用） */
longPress($('home'), 3000, () => { if (st.unlocked) relock(); });

window.addEventListener('keydown', (e) => {
  if (st.unlocked) return;
  if (/^[0-9]$/.test(e.key)) addDigit(e.key);
  else if (e.key === 'Backspace') { st.input = st.input.slice(0, -1); renderDots(); }
});

/* =====================================================================
   ページ切り替え
   ===================================================================== */
const pagesEl = $('pages');
const piEls = () => Array.from($('pageind').children);
let cur = 0, dragging = false, startX = 0, startY = 0, dx = 0, axis = null;
const W = () => window.innerWidth;

function goPage(i, animate) {
  cur = Math.max(0, Math.min(1, i));
  if (animate === false) pagesEl.style.transition = 'none';
  pagesEl.style.transform = 'translateX(' + (-cur * W()) + 'px)';
  if (animate === false) { void pagesEl.offsetWidth; pagesEl.style.transition = ''; }
  piEls().forEach((d, n) => d.classList.toggle('on', n === cur));
}
goPage(0, false);
window.addEventListener('resize', () => { goPage(cur, false); layoutOverlays(); });
document.addEventListener('fullscreenchange', () => layoutOverlays());
try { matchMedia('(display-mode: fullscreen)').addEventListener('change', () => layoutOverlays()); } catch (e) {}

pagesEl.addEventListener('pointerdown', (e) => {
  if (!st.unlocked) return;
  dragging = true; axis = null; dx = 0;
  startX = e.clientX; startY = e.clientY;
  pagesEl.style.transition = 'none';
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const ddx = e.clientX - startX, ddy = e.clientY - startY;
  if (axis === null) {
    if (Math.abs(ddx) > 8 || Math.abs(ddy) > 8) axis = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
    else return;
  }
  if (axis !== 'x') return;
  dx = ddx;
  if ((cur === 0 && dx > 0) || (cur === 1 && dx < 0)) dx *= 0.32;
  pagesEl.style.transform = 'translateX(' + (-cur * W() + dx) + 'px)';
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  pagesEl.style.transition = '';
  if (axis === 'x' && Math.abs(dx) > W() * 0.18) goPage(cur + (dx < 0 ? 1 : -1));
  else goPage(cur);
  dx = 0; axis = null;
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

$('pageind').addEventListener('pointerup', (e) => {
  const i = piEls().indexOf(e.target.closest('.pi'));
  if (i >= 0) goPage(i);
});


/* =====================================================================
   その他
   ===================================================================== */
if (CFG.autoFullscreen) {
  const goFs = () => {
    document.removeEventListener('pointerdown', goFs);
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  };
  document.addEventListener('pointerdown', goFs);
}

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
